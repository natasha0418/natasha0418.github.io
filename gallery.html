	<style>
		.navbar { padding-top: 1.0rem !important; padding-bottom: 1.0rem !important; background-color: #f1f3f5 !important; }
		.navbar .nav-link, .navbar-brand { padding-top: 0.25rem !important; padding-bottom: 0.25rem !important; font-size: 1rem; }
		.navbar-toggler { margin-left: auto; }

		.about { font-size: 1rem; }
		.header-1 { font-size: 1.8rem; color: #444; }

		/* Gallery layout: 1 per row on XS, up to 3 per row on >= md */
		.gallery-grid img { width: 100%; height: 100%; display: block; object-fit: cover; }
		.gallery-grid .col-12 { padding-left: 0; padding-right: 0; }
		/* Uniform square tiles with spacing */
		.gallery-tile { position: relative; width: 100%; padding-top: 100%; /* 1:1 ratio */ }
		.gallery-tile > img { position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
		/* Add spacing between items (override Bootstrap px-0 utility) */
		.gallery-grid > [class^="col-"] { padding-left: 8px; padding-right: 8px; margin-bottom: 12px; }
		.gallery-grid > [class^="col-"].px-0 { padding-left: 8px !important; padding-right: 8px !important; }
		.gallery-section { padding: 16px 12px 24px 12px; margin-top: 8px; margin-bottom: 8px; }
		.gallery-section:nth-of-type(odd) { background: #ffffff; }
		.gallery-section:nth-of-type(even) { background: #eef1f4; }
		/* Ensure the section background fully wraps the tiles */
		.container .gallery-section .row { margin-left: 0; margin-right: 0; }

		.page-bottom-space { height: 72px; }
	</style>

	<!-- Modal for lightbox -->
	<div class="modal fade" id="imageModal" tabindex="-1" role="dialog" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered modal-lg" role="document">
			<div class="modal-content" style="background: transparent; border: none;">
				<button type="button" class="close ml-auto pr-3 pt-2" data-dismiss="modal" aria-label="Close" style="color: white; opacity: 1;">
					<span aria-hidden="true">&times;</span>
				</button>
				<img id="modalImage" src="" alt="Preview" class="img-fluid rounded">
				<div id="modalCaption" class="text-center text-white pb-3" style="font-weight:500;"></div>
			</div>
		</div>
	</div>

	<script>
		// Build a flat ordered list of gallery images for navigation
		var galleryImages = [];
		function rebuildGalleryIndex() {
			galleryImages = [];
			$('.gallery-img').each(function(index){
				galleryImages.push({ src: $(this).attr('src'), section: $(this).data('section') || '' });
				$(this).attr('data-index', index);
			});
		}
		rebuildGalleryIndex();

		var currentIndex = -1;
		function openAt(index) {
			if (galleryImages.length === 0) return;
			// wrap around
			if (index < 0) index = galleryImages.length - 1;
			if (index >= galleryImages.length) index = 0;
			currentIndex = index;
			var item = galleryImages[currentIndex];
			$('#modalImage').attr('src', item.src);
			$('#modalCaption').text(item.section || '');
			$('#imageModal').modal('show');
		}

		// Open clicked image in modal at full size
		$(document).on('click', '.gallery-img', function () {
			var idx = parseInt($(this).attr('data-index'));
			if (isNaN(idx)) { rebuildGalleryIndex(); idx = parseInt($(this).attr('data-index')); }
			openAt(idx);
		});

		// Keyboard navigation when modal is open
		$(document).on('keydown', function(e){
			if (!$('#imageModal').hasClass('show')) return;
			if (e.key === 'ArrowRight') { e.preventDefault(); openAt(currentIndex + 1); }
			else if (e.key === 'ArrowLeft') { e.preventDefault(); openAt(currentIndex - 1); }
		});

		// Rebuild index on window resize or DOM changes (simple hooks)
		$(window).on('resize', rebuildGalleryIndex);
	</script>
