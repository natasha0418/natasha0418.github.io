<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title>Gallery | Natasha Gonsalves</title>
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" crossorigin="anonymous">
	<link rel="stylesheet" href="./css/academicons.min.css">
	<script src="https://kit.fontawesome.com/cf1c3caa39.js" crossorigin="anonymous"></script>
</head>
<body>
	<nav class="navbar navbar-expand-lg navbar-light py-2" style="position: sticky; top: 0; z-index: 1030;">
		<a class="navbar-brand" href="index.html">Natasha Gonsalves</a>
		<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
			<span class="navbar-toggler-icon"></span>
		</button>
		<div class="collapse navbar-collapse" id="navbarNav">
			<ul class="navbar-nav ml-auto">
				<li class="nav-item"><a class="nav-link" href="experience.html">Experience</a></li>
				<li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
				<li class="nav-item active"><a class="nav-link" href="gallery.html">Gallery</a></li>
			</ul>
		</div>
	</nav>

	<div class="container pt-4 allstuffp">
		<div class="col-md-12 pt-3 about text-justify">
			<div class="header-1 pt-2">Gallery</div>
			<p>Some snapshots from projects, events and life.</p>

			<div class="row" id="gallery-grid">
				<!-- Each image uses Bootstrap responsive classes -->
				<div class="col-6 col-md-4 col-lg-3 mb-4">
					<img src="images/pic1.jpeg" alt="Portrait" class="img-fluid rounded shadow-sm">
				</div>
				<!-- Add more images here as they become available -->
			</div>

			<div class="page-bottom-space"></div>
		</div>
	</div>

	<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" crossorigin="anonymous"></script>
	<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js" crossorigin="anonymous"></script>

	<style>
		.navbar { padding-top: 1.0rem !important; padding-bottom: 1.0rem !important; background-color: #f1f3f5 !important; }
		.navbar .nav-link, .navbar-brand { padding-top: 0.25rem !important; padding-bottom: 0.25rem !important; font-size: 1rem; }
		.navbar-toggler { margin-left: auto; }

		.about { font-size: 1rem; }
		.header-1 { font-size: 1.8rem; color: #444; }

		#gallery-grid img { object-fit: cover; width: 100%; height: 100%; }
		#gallery-grid .col-6, #gallery-grid .col-md-4, #gallery-grid .col-lg-3 { display: flex; }
		#gallery-grid .col-6 > img, #gallery-grid .col-md-4 > img, #gallery-grid .col-lg-3 > img { height: 180px; }

		@media (min-width: 768px) {
			#gallery-grid .col-md-4 > img { height: 200px; }
		}
		@media (min-width: 992px) {
			#gallery-grid .col-lg-3 > img { height: 220px; }
		}

		.page-bottom-space { height: 72px; }
	</style>
</body>
</html>
